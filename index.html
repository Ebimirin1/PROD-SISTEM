<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SGP Industrial — Famosa Linguiça</title>
  <link rel="icon" type="image/png" href="assets/brand/favicon.png">

  <!-- Google Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface-tint": "#380000",
            "on-secondary-container": "#3d2700",
            "error": "#ba1a1a",
            "on-primary-fixed-variant": "#380000",
            "text-muted": "#5E5650",
            "tertiary": "#7a5200",
            "tertiary-container": "#e69f0f",
            "on-tertiary-fixed": "#291800",
            "on-primary-container": "#f5c96b",
            "badge-warning-text": "#4A2C00",
            "amber-warning": "#D99311",
            "surface-container-lowest": "#ffffff",
            "surface-dim": "#efe4cf",
            "tertiary-fixed-dim": "#ffb94e",
            "inverse-primary": "#f5c96b",
            "bordeaux-primary": "#380000",
            "secondary": "#9a6500",
            "primary-container": "#380000",
            "outline": "#8a7d70",
            "surface-variant": "#f6e6c4",
            "on-secondary-fixed": "#291800",
            "inverse-surface": "#1f1712",
            "on-error-container": "#93000a",
            "surface-container-low": "#fdf8ee",
            "on-tertiary-container": "#1a1000",
            "surface": "#fffcf7",
            "on-primary": "#ffffff",
            "primary": "#380000",
            "error-container": "#ffdad6",
            "on-surface-variant": "#4f463f",
            "primary-fixed": "#f6e6c4",
            "outline-variant": "#e2d6c4",
            "badge-error-bg": "#FDE8E8",
            "badge-warning-bg": "#FFF2D6",
            "on-tertiary-fixed-variant": "#624000",
            "alert-critical": "#D90404",
            "background": "#fffcf7",
            "on-error": "#ffffff",
            "on-surface": "#1f1712",
            "on-primary-fixed": "#1f0000",
            "inverse-on-surface": "#fbf1dc",
            "surface-container-high": "#f8ebd0",
            "on-background": "#1f1712",
            "secondary-fixed": "#f6e6c4",
            "surface-card": "#FFFFFF",
            "on-secondary": "#ffffff",
            "secondary-container": "#f5c96b",
            "badge-error-text": "#8C0303",
            "on-tertiary": "#ffffff",
            "surface-bright": "#fff8f7",
            "status-info": "#205A85",
            "on-secondary-fixed-variant": "#5c3d00",
            "tertiary-fixed": "#fbe3b0",
            "surface-canvas": "#F7F4EE",
            "ink-text": "#1F1712",
            "status-success": "#176B45",
            "wine-deep": "#000000",
            "surface-container-highest": "#f6e6c4",
            "surface-container": "#fbf1dc",
            "secondary-fixed-dim": "#f5c96b",
            "border-subtle": "#E7E0D5",
            "primary-fixed-dim": "#f5c96b",
            "brand-gold": "#e69f0f",

          borderRadius: {
            DEFAULT: "0.25rem",

            xl: "0.75rem",

          },
          spacing: {
            margin: "1rem",
            "space-md": "1rem",

            gutter: "1rem",
            "space-2xl": "3rem",
            "gutter-desktop": "1.5rem",
            "margin-desktop": "2rem",
            "space-sm": "0.5rem",
            "space-xs": "0.25rem",
            "margin-tablet": "1.5rem",
            "gutter-tablet": "1.25rem",
            "space-xl": "2rem"
          },
          fontFamily: {
            "title-lg": ["Ubuntu", "sans-serif"],
            "body-lg": ["Ubuntu", "sans-serif"],
            "label-md": ["Ubuntu", "sans-serif"],
            "body-md": ["Ubuntu", "sans-serif"],
            "tabular-data-md": ["Ubuntu", "sans-serif"],
            "tabular-data-lg": ["Ubuntu", "sans-serif"],
            "display-lg": ["Ubuntu", "sans-serif"],
            "headline-md": ["Ubuntu", "sans-serif"],
            "title-md": ["Ubuntu", "sans-serif"],
            "label-sm": ["Ubuntu", "sans-serif"],
            "headline-sm": ["Ubuntu", "sans-serif"],
            "display-lg-mobile": ["Ubuntu", "sans-serif"]
          }
        }
      }
    };
  </script>

  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    @layer base {
      html, body { margin: 0; padding: 0; }
      body { overscroll-behavior: none; }
    }
    ::-webkit-scrollbar { display: none; }

    /* Identidade Famosa Linguiça: Ubuntu Bold nos títulos, Medium nos subtítulos */
    body { font-family: "Ubuntu", sans-serif; }
    .font-display-lg, .font-display-lg-mobile, .font-headline-md, .font-headline-sm, h1, h2 { font-weight: 700; }
    .font-title-lg, .font-title-md, h3 { font-weight: 500; }

    /* Mobile web: evita que tabelas, gráficos e textos longos alarguem a página */
    @media (max-width: 1023px) {
      body.sidebar-open { overflow: hidden; }
    }
    @media (max-width: 639px) {
      #main-content table { font-size: 0.8125rem; }
      #main-content th, #main-content td { white-space: nowrap; }
    }
  </style>
</head>
<body class="bg-surface-canvas font-body-md text-ink-text min-h-screen">

  <!-- Modal de Autenticação -->
  <div id="login-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-surface-card rounded-2xl shadow-xl border border-border-subtle max-w-md w-full p-space-lg flex flex-col gap-space-md">
      <div class="flex flex-col items-center text-center gap-2">
        <img src="assets/brand/logo-horizontal.png" alt="Famosa Linguiça" class="h-12 w-auto mb-1">
        <h2 class="font-headline-sm text-headline-sm text-ink-text">SGP Industrial</h2>
        <p class="font-body-md text-body-md text-text-muted">Acesse com suas credenciais autorizadas</p>
      </div>

      <form id="login-form" class="flex flex-col gap-space-md">
        <div class="flex flex-col gap-1">
          <label class="font-label-md text-label-md text-ink-text" for="login-email">Usuário</label>
          <input type="text" id="login-email" required autocomplete="username" autocapitalize="none" class="min-h-[44px] px-3.5 rounded-lg border border-border-subtle bg-surface-card text-ink-text focus:outline-none focus:border-bordeaux-primary transition-colors" placeholder="Ex: joao.silva">
        </div>

        <div class="flex flex-col gap-1">
          <label class="font-label-md text-label-md text-ink-text" for="login-password">Senha</label>
          <input type="password" id="login-password" required class="min-h-[44px] px-3.5 rounded-lg border border-border-subtle bg-surface-card text-ink-text focus:outline-none focus:border-bordeaux-primary transition-colors" placeholder="••••••••">
        </div>

        <div id="login-error" class="hidden p-3 rounded-lg bg-badge-error-bg text-badge-error-text text-xs font-medium"></div>

        <button type="submit" id="login-submit-btn" class="min-h-[44px] w-full rounded-lg bg-bordeaux-primary hover:bg-wine-deep text-on-primary font-title-md transition-all shadow-sm active:scale-98 flex items-center justify-center gap-2">
          <span>Entrar no Sistema</span>
          <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
        </button>

        <p class="text-center text-xs text-text-muted">Esqueceu a senha? Peça ao administrador para trocar em Usuários &amp; Acessos.</p>
      </form>
    </div>
  </div>

  <!-- Estrutura Principal da Aplicação -->
  <div id="app-container" class="hidden min-h-screen">
    <!-- Sidebar Navigation -->
    <!-- Fundo escuro do menu lateral no mobile -->
    <div id="sidebar-overlay" class="hidden fixed inset-0 z-40 bg-black/50 lg:hidden"></div>

    <aside id="app-sidebar" class="fixed left-0 top-0 h-full w-64 max-w-[85vw] bg-wine-deep border-t-4 border-brand-gold z-50 flex flex-col justify-between shadow-[0_1px_8px_rgba(0,0,0,0.04)] -translate-x-full lg:translate-x-0 transition-transform duration-200">
      <div class="flex flex-col min-h-0">
        <div class="h-16 px-space-md flex items-center gap-space-sm border-b border-white/10">
          <img src="assets/brand/coroa-dourada.png" alt="" class="h-6 w-auto shrink-0">
          <div class="flex flex-col flex-1 min-w-0">
            <span class="font-title-md text-title-md text-on-primary leading-tight truncate">SGP Industrial</span>
            <span class="font-label-sm text-label-sm text-brand-gold uppercase tracking-wider truncate">Famosa Linguiça</span>
          </div>
          <button type="button" id="sidebar-close-btn" class="lg:hidden w-10 h-10 -mr-2 rounded-lg text-on-primary hover:bg-white/10 flex items-center justify-center" aria-label="Fechar menu">
            <span class="material-symbols-outlined text-[22px]">close</span>
          </button>
        </div>

        <nav id="sidebar-nav" class="flex flex-col gap-1 p-space-sm overflow-y-auto min-h-0">
          <!-- Links de Navegação serão preenchidos dinamicamente pelo JS -->
        </nav>
      </div>

      <div class="p-space-sm border-t border-white/10 flex flex-col gap-2">
        <div class="flex items-center justify-between px-2 text-white/70">
          <span class="font-label-sm text-label-sm">Status</span>
          <span class="font-tabular-data-md text-tabular-data-md text-on-primary">ONLINE</span>
        </div>
        <button id="logout-btn" class="min-h-[40px] px-3 rounded-lg bg-white/10 hover:bg-white/20 text-on-primary font-label-md flex items-center justify-center gap-2 transition-colors">
          <span class="material-symbols-outlined text-[18px]">logout</span>
          <span>Sair da Conta</span>
        </button>
      </div>
    </aside>

    <!-- Main Workspace Area -->
    <div class="lg:pl-64">
      <header class="fixed top-0 left-0 lg:left-64 right-0 h-16 bg-surface-card border-b-2 border-brand-gold shadow-[0_1px_8px_rgba(0,0,0,0.04)] z-30 flex items-center justify-between gap-2 px-3 sm:px-space-lg">
        <div class="flex items-center gap-2 sm:gap-space-md min-w-0">
          <button type="button" id="sidebar-open-btn" class="lg:hidden w-10 h-10 -ml-1 shrink-0 rounded-lg text-ink-text hover:bg-surface-canvas flex items-center justify-center" aria-label="Abrir menu">
            <span class="material-symbols-outlined text-[24px]">menu</span>
          </button>
          <span class="hidden sm:inline material-symbols-outlined text-[20px] text-brand-gold-dark">precision_manufacturing</span>
          <span id="current-screen-title" class="font-title-lg text-title-lg text-ink-text truncate">Visão Geral</span>
        </div>

        <div class="flex items-center gap-space-md shrink-0">
          <div class="hidden md:flex items-center gap-2 px-3 py-1.5 rounded-full bg-surface-canvas">
            <span class="w-2.5 h-2.5 rounded-full bg-status-success animate-pulse"></span>
            <span class="font-label-md text-label-md text-status-success">SISTEMA ONLINE</span>
          </div>
          <div class="hidden md:block h-6 w-px bg-border-subtle"></div>
          <div class="flex items-center gap-space-sm">
            <div class="hidden sm:flex flex-col text-right">
              <span id="user-display-name" class="font-title-md text-title-md text-ink-text leading-none">Usuário</span>
              <span id="user-role-label" class="font-label-sm text-label-sm text-text-muted leading-tight">Operador</span>
            </div>
            <div class="w-8 h-8 shrink-0 rounded-full bg-primary flex items-center justify-center text-on-primary font-bold">
              <span class="material-symbols-outlined text-[18px]">person</span>
            </div>
          </div>
        </div>
      </header>

      <main id="main-content" class="w-full pt-16 bg-surface-canvas min-h-screen px-3 pb-6 sm:px-space-lg sm:pb-space-lg max-w-[1720px] mx-auto overflow-x-hidden">
        <!-- Renderização dinâmica das visões -->
      </main>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
