# PostgREST do SGP (servidor local). Copiar para C:\SGP\postgrest\postgrest.conf
# Troque as duas linhas marcadas com TROQUE pelos mesmos valores usados em 01_preparar_banco.sql.

# TROQUE: senha do papel authenticator
db-uri = "postgres://authenticator:TROQUE_SENHA_DA_API@127.0.0.1:5432/sgp"
db-schemas = "public"
db-anon-role = "anon"

# TROQUE: a mesma frase gravada em auth.jwt_secret
jwt-secret = "TROQUE_POR_UMA_FRASE_SECRETA_DE_32_OU_MAIS_LETRAS"

# Só o Caddy (no próprio servidor) fala com o PostgREST
server-host = "127.0.0.1"
server-port = 3000
